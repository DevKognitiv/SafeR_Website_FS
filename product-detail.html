<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeR — Produit</title>
  <meta name="description" content="Fiche produit SafeR.">
  <meta property="og:title" content="SafeR — Produit">
  <meta property="og:image" content="https://safer.ci/assets/og-image.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=1">
</head>
<body data-page="store">
  <div id="nav-mount"></div>

  <main>
    <section style="padding:32px 0">
      <div class="container" id="productMount">
        <p style="color:var(--muted)">Chargement…</p>
      </div>
    </section>

    <section style="background:var(--bg-soft)">
      <div class="container">
        <h2 style="margin-bottom:24px">Produits similaires</h2>
        <div class="grid-4" id="relatedMount"></div>
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="/js/config.js?v=1"></script>
  <script src="/js/i18n.js?v=1"></script>
  <script src="/js/icons.js?v=1"></script>
  <script src="/js/data.js?v=1"></script>
  <script src="/js/site-chrome.js?v=1"></script>
  <script>
    (function () {
      const id = parseInt(new URLSearchParams(location.search).get('id'), 10);
      const product = (window.PRODUCTS || []).find((p) => p.id === id);
      const mount = document.getElementById('productMount');
      const related = document.getElementById('relatedMount');
      const fmt = (n) => n.toLocaleString('fr-FR');

      if (!product) {
        mount.innerHTML = '<p>Produit introuvable. <a href="/index.html#/store">Retour à la boutique</a></p>';
        return;
      }

      document.title = `SafeR — ${product.name}`;
      document.querySelector('meta[name="description"]').setAttribute('content', product.description);

      const render = () => {
        mount.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start">
            <div style="background:var(--bg-soft);border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1">
              <img src="${product.img}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover">
            </div>
            <div>
              <small style="color:var(--muted)">${product.brand} · ${product.sku} · ${product.cat}</small>
              <h1 style="margin-top:4px">${product.name}</h1>
              <p style="color:var(--ink-soft)">${product.description}</p>
              <div style="font-size:2rem;font-weight:800;margin:16px 0">${fmt(product.price)} <span style="font-size:14px;color:var(--muted);font-weight:500">FCFA</span></div>
              <ul style="list-style:none;padding:0;margin:24px 0">
                ${product.features.map((f) => `<li style="display:flex;gap:8px;align-items:flex-start;padding:6px 0"><span style="color:var(--safer-orange);font-weight:700">✓</span> ${f}</li>`).join('')}
              </ul>
              <div style="display:flex;gap:12px;flex-wrap:wrap">
                <button class="btn btn-primary btn-lg" type="button" id="addBtn" data-i18n="common.add">Ajouter au panier</button>
                <a class="btn btn-ghost btn-lg" href="/contact.html?plan=quote&sku=${product.sku}">Demander un devis avec ce produit</a>
              </div>
              <div style="display:flex;gap:8px;align-items:center;margin-top:24px;color:var(--muted);font-size:14px">
                <span style="color:var(--gold-500)">★★★★★</span>
                <span>${product.rating} · ${product.reviews} avis</span>
              </div>
            </div>
          </div>
        `;
        document.getElementById('addBtn').addEventListener('click', (e) => {
          e.preventDefault();
          let cart = [];
          try { cart = JSON.parse(localStorage.getItem('safer_cart') || '[]'); } catch (_) {}
          const existing = cart.find((i) => i.id === product.id);
          if (existing) existing.qty += 1;
          else cart.push({ id: product.id, name: product.name, sku: product.sku, price: product.price, qty: 1 });
          try { localStorage.setItem('safer_cart', JSON.stringify(cart)); } catch (_) {}
          const orig = e.target.textContent;
          e.target.textContent = window.SaferChrome.t('common.added', document.documentElement.lang || 'fr');
          setTimeout(() => { e.target.textContent = orig; }, 1200);
        });
      };
      render();

      // Related
      const others = (window.PRODUCTS || []).filter((p) => p.cat === product.cat && p.id !== product.id).slice(0, 4);
      related.innerHTML = others.map((p) => `
        <article class="product-card">
          <a href="/product-detail.html?id=${p.id}" class="img-wrap">
            <img src="${p.img}" alt="${p.name}" loading="lazy">
          </a>
          <div class="body">
            <div class="meta">${p.brand} · ${p.sku}</div>
            <div class="name">${p.name}</div>
            <div class="price">${fmt(p.price)} <span style="font-size:13px;color:var(--muted)">FCFA</span></div>
            <a class="btn btn-ghost btn-sm" href="/product-detail.html?id=${p.id}">En savoir plus</a>
          </div>
        </article>
      `).join('') || '<p style="color:var(--muted)">Pas d\'autres produits dans cette catégorie pour le moment.</p>';

      // Re-render on lang change so the texts inside the dynamic markup update
      document.addEventListener('safer:langchange', render);
    })();
  </script>
</body>
</html>
